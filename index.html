.bg .shade{position:absolute; inset:0; background:
  linear-gradient(180deg, rgba(10,6,0,.55) 0%, rgba(10,6,0,.30) 26%, rgba(10,6,0,.50) 62%, rgba(10,6,0,.92) 100%)}

.page{position:relative; z-index:1; width:100%; max-width:480px; min-height:100vh; min-height:100dvh;
  margin:0 auto; padding:52px 20px 30px; display:flex; flex-direction:column; align-items:center; text-align:center}

.avatar{width:100px; height:100px; border-radius:50%; padding:3px;
  background:linear-gradient(140deg,#ffe9b0,#a9782f); box-shadow:0 0 30px rgba(243,205,107,.45),0 10px 28px rgba(0,0,0,.5)}
.avatar img{display:block; width:100%; height:100%; border-radius:50%; object-fit:cover; background:#1a1206}

h1{margin:18px 0 0; display:inline-flex; align-items:center; gap:8px; font-size:clamp(1.7rem,8vw,2.2rem);
  font-weight:700; letter-spacing:-.01em; text-shadow:0 2px 18px rgba(0,0,0,.6)}
.badge{width:.75em; height:.75em; flex:none}
.desc{margin:8px 0 0; width:100%; max-width:300px; margin-left:auto; margin-right:auto;
  font-size:clamp(.62rem,2.8vw,.74rem); letter-spacing:.01em; white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; text-align:center; color:var(--ink-soft); text-shadow:0 2px 12px rgba(0,0,0,.65)}

.section{width:100%; margin-top:34px}
.section + .section{margin-top:26px}
.section h2{margin:0 0 12px; text-align:left; font-size:.98rem; font-weight:600; color:#ffffff;
  text-shadow:0 2px 10px rgba(0,0,0,.6)}
.links{display:grid; gap:12px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px}

button.btn{font-family:inherit; cursor:pointer; -webkit-appearance:none; appearance:none; margin:0}
.btn{position:relative; display:flex; align-items:center; justify-content:center; gap:10px;
  width:100%; min-height:64px; padding:10px 18px; border-radius:18px; color:var(--ink); text-decoration:none;
  font-size:1rem; font-weight:500; text-align:center;
  background:linear-gradient(135deg,var(--glass-a),var(--glass-b)); border:1px solid var(--glass-line);
  -webkit-backdrop-filter:blur(14px) saturate(120%); backdrop-filter:blur(14px) saturate(120%);
  box-shadow:0 10px 28px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.22);
  transition:transform .15s ease; -webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:3px solid var(--gold); outline-offset:3px}
.btn .ic{flex:none; display:grid; place-items:center; width:26px; height:26px}
.btn .pay-ic{width:30px; height:30px; border-radius:50%; box-shadow:0 3px 10px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.3)}
.btn .label-col{display:inline-flex; flex-direction:column; align-items:center}
.btn small{display:block; margin-top:2px; font-size:.76rem; font-weight:400; color:rgba(255,255,255,.65)}
.wide{grid-column:1/-1}

footer{margin-top:auto; padding-top:44px; display:flex; align-items:center; gap:6px;
  font-size:.85rem; color:rgba(255,255,255,.78); text-shadow:0 1px 10px rgba(0,0,0,.6)}

/* ---- sheet/modal ---- */
.sheet{position:fixed; inset:0; z-index:50; display:flex; align-items:flex-end; justify-content:center}
.sheet-backdrop{position:absolute; inset:0; background:rgba(6,4,0,.72); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px)}
.sheet-panel{position:relative; width:100%; max-width:480px; max-height:calc(100dvh - 16px); overflow-y:auto;
  padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px)); border-radius:26px 26px 0 0;
  border:1px solid var(--glass-line); border-bottom:0; text-align:left; outline:none;
  background:linear-gradient(165deg, rgba(40,28,6,.97), rgba(12,8,1,.98)); box-shadow:0 -18px 60px rgba(0,0,0,.6)}
@media (min-width:520px){ .sheet{align-items:center} .sheet-panel{border-radius:26px; border-bottom:1px solid var(--glass-line)} }
.sheet-close{position:absolute; top:14px; right:14px; width:38px; height:38px; border-radius:50%;
  border:1px solid var(--glass-line); cursor:pointer; background:rgba(255,255,255,.1); color:#fff;
  font-size:1.4rem; line-height:1; display:grid; place-items:center; padding:0 0 2px}
.sheet h3{margin:0 0 6px; font-size:1.2rem; font-weight:600}
.sheet .body{font-size:.92rem; line-height:1.6; color:var(--ink-soft)}
.sheet ol{margin:0; padding-left:20px}
.sheet ol li+li{margin-top:8px}
.copybox{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:14px;
  padding:12px 16px; border-radius:14px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2)}
.copybox b{font-weight:600; font-size:1.02rem; word-break:break-all}
.copybox span{display:block; font-size:.78rem; color:rgba(255,255,255,.6)}
.copy-btn{flex:none; padding:8px 14px; border-radius:999px; border:0; font:inherit; font-size:.8rem; font-weight:600;
  color:#0c0700; background:linear-gradient(135deg,#ffe9b0,#c79a3f); cursor:pointer}
.qris-wrap{margin-top:14px; padding:12px; border-radius:18px; background:#fff}
.qris-wrap img{display:block; width:100%; border-radius:8px}

.logo-btn{padding:12px 10px; flex-direction:column; gap:6px; min-height:78px}
.pay-logo{width:34px; height:34px; object-fit:contain}
.logo-btn span.pay-label{font-size:.82rem; font-weight:500}
</style>
</head>

var TEMPLATES = {
  beli: {
    title: "Cara Beli Akun",
    body: '<ol>'
      + '<li>Screenshot akun yang ingin dibeli.</li>'
      + '<li>Klik tombol WhatsApp untuk masuk ke admin, chat admin dan beri tahu ingin beli akun yang mana, lakukan payment, lalu tunggu proses.</li>'
      + '</ol>'
  },
  rekber: {
    title: "Cara Mc Rekber",
    body: '<p style="margin:0 0 6px">Langsung buat grup berisi pembeli, penjual, dan Admin, dengan format nama grup:</p>'
      + '<div class="copybox"><span style="min-width:0"><span style="display:block">Rekber akun | nominal harga | Ndraa Store</span></span>'
      + '<button type="button" class="copy-btn" data-copy="Rekber akun | nominal harga | Ndraa Store">Salin</button></div>'
  }
};

function payTemplate(label){
  if (label === "QRIS"){
    return { title: "QRIS - " + label,
      body: '<p style="margin:0 0 4px">Scan QRIS di bawah untuk membayar.</p>'
        + '<div class="qris-wrap"><img src="' + QRIS_IMG + '" alt="QRIS payment Ndraa Store"></div>' };
  }
  return { title: label,
    body: '<p style="margin:0 0 4px">Transfer ke nomor berikut, lalu konfirmasi ke admin.</p>'
      + '<div class="copybox"><span><b>' + PAY_NUM + '</b><span>a.n. ' + PAY_NAME + '</span></span>'
      + '<button type="button" class="copy-btn" data-copy="' + PAY_NUM + '">Salin</button></div>' };
}

var sheet=document.getElementById("sheet"), panel=document.getElementById("panel"), body=document.getElementById("sheetBody");
var lastFocus=null;

function open(tpl){
  lastFocus=document.activeElement;
  body.innerHTML = '<h3>'+tpl.title+'</h3><div class="body">'+tpl.body+'</div>';
  sheet.hidden=false; document.body.classList.add("lock"); panel.scrollTop=0; panel.focus();
}
function close(){ sheet.hidden=true; document.body.classList.remove("lock"); if(lastFocus&&lastFocus.focus) lastFocus.focus(); }

document.querySelectorAll("[data-pay]").forEach(function(b){
  b.addEventListener("click", function(){ open(payTemplate(b.getAttribute("data-pay"))); });
});
document.querySelectorAll("[data-info]").forEach(function(b){
  b.addEventListener("click", function(){ open(TEMPLATES[b.getAttribute("data-info")]); });
});
sheet.addEventListener("click", function(e){
  var t=e.target;
  while(t && t!==sheet){ if(t.hasAttribute && t.hasAttribute("data-close")){close(); return;} t=t.parentNode; }
});
document.addEventListener("keydown", function(e){
  if(sheet.hidden) return;
  if(e.key==="Escape"){ close(); return; }
});
body.addEventListener("click", function(e){
  var t=e.target;
  if(t && t.matches && t.matches("[data-copy]")){
    var val=t.getAttribute("data-copy");
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(val).then(function(){
        var old=t.textContent; t.textContent="Tersalin"; setTimeout(function(){t.textContent=old;},1400);
      });
    }
  }
});
})();
</script>
</body>
</html>
